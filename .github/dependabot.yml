version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /evmd
    schedule:
      interval: weekly
    groups:
      evmd-go-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /contracts
    schedule:
      interval: weekly
    groups:
      contracts-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # 0.7+ removes interfaces/UserOperation.sol used by the account-abstraction
      # test contracts and pulls @openzeppelin/contracts 3.4.2-solc-0.7 (critical
      # and high advisories) through @uniswap/v3-periphery. Move it by hand.
      - dependency-name: "@account-abstraction/contracts"
