name: Compatibility Tests for Web3.js

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web3js-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
      GOMEMLIMIT: 3GiB
      GOFLAGS: -p=1

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git jq

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: nightly

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Cache Node.js modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/evm-tools-compatibility/web3.js/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('tests/evm-tools-compatibility/web3.js/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install locked test dependencies
        working-directory: tests/evm-tools-compatibility/web3.js
        run: |
          npm ci
          npm run test:tooling

      - name: Audit all compatibility dependencies
        working-directory: tests/evm-tools-compatibility/web3.js
        run: npm audit --audit-level=low

      - name: Build and install evmd
        run: |
          make install

      - name: Run web3.js compatibility tests
        run: |
          chmod +x scripts/tests_compatibility_web3js.sh
          ./scripts/tests_compatibility_web3js.sh --verbose
        env:
          COMPAT_DIR: ${{ github.workspace }}/tests/evm-tools-compatibility
          COMPAT_SUITE: web3.js
