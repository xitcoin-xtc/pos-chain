name: Xitcoin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            evmd/go.sum
            tools/go.sum

      - name: Verify canonical release state
        run: python3 scripts/verify-xitcoin-release-state.py

      - name: Verify immutable GitHub Actions
        run: bash scripts/verify-actions-pinned.sh

      - name: Run Go tests
        run: go test -tags=test ./...

      - name: Run evmd Go tests
        # evmd is a separate module (application, keepers wiring, integration
        # suites); it is not covered by the root module run above.
        working-directory: evmd
        run: go test -tags=test ./...

      - name: Build xitcoind
        # Keep symbols: a stripped binary hides which functions govulncheck
        # can attribute findings to.
        run: make build COSMOS_BUILD_OPTIONS=nostrip
        env:
          GOFLAGS: -trimpath

      - name: Check the binary
        run: ./build/xitcoind version --long

      # Source scans of every module run in security.yml.
      - name: Scan the binary with govulncheck
        run: |
          go tool nm build/xitcoind > /dev/null # fails if the binary is stripped
          go -C tools install golang.org/x/vuln/cmd/govulncheck
          govulncheck -mode=binary build/xitcoind
