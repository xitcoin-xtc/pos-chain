name: Security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily, so new advisories are reported without waiting for a change.
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [., evmd, tests/speedtest, tests/systemtests, tests/jsonrpc/simulator]
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            ${{ matrix.module }}/go.sum
            tools/go.sum

      - name: Install govulncheck (version pinned in tools/go.mod)
        run: go -C tools install golang.org/x/vuln/cmd/govulncheck

      - name: Scan source (fails on any called vulnerability)
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...

  govulncheck-binary:
    # Pushes and pull requests scan the binary in ci.yml; this keeps a daily
    # scan of the release build for advisories published in between.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: govulncheck (release binary)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            evmd/go.sum
            tools/go.sum

      - name: Install govulncheck (version pinned in tools/go.mod)
        run: go -C tools install golang.org/x/vuln/cmd/govulncheck

      - name: Build xitcoind with symbols
        # A stripped binary hides which symbols are used.
        run: make build COSMOS_BUILD_OPTIONS=nostrip
        env:
          GOFLAGS: -trimpath

      - name: Scan binary
        run: |
          go tool nm build/xitcoind > /dev/null # fails if the binary is stripped
          govulncheck -mode=binary build/xitcoind

  forks:
    name: Go forks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            evmd/go.sum

      - name: Check fork replacements
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check-forks.sh

  zizmor:
    name: Workflow security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false
          annotations: true
          min-severity: high
