name: System Test

on:
  schedule:
    - cron: '0 2 * * 0' # weekly, Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-system:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Install Foundry (forge/cast/anvil)
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: stable

      - name: Run system tests
        run: make test-system
