name: Protobuf

on:
  pull_request:
    branches: [main]
    paths:
      - 'proto/**'
      - 'buf.work.yaml'
      - '.github/workflows/proto.yml'

permissions:
  contents: read

jobs:
  buf:
    name: buf lint and breaking
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Lint (proto/buf.yaml) and check wire/API compatibility against the
      # base branch. Add the "buf skip breaking" label for an intended break.
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.72.0
          input: proto
          lint: true
          format: false
          breaking: ${{ !contains(github.event.pull_request.labels.*.name, 'buf skip breaking') }}
          breaking_against: ${{ github.event.repository.clone_url }}#format=git,commit=${{ github.event.pull_request.base.sha }},subdir=proto
          push: false
          archive: false
          pr_comment: false
