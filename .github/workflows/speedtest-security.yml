name: Speedtest security qualification
on:
  pull_request:
    branches: [main]
    paths: ['tests/speedtest/**', 'go.mod', 'go.sum', 'evmd/**', '**/*.go', 'docs/security-assessment.json', 'docs/security-review-2026-11-04.md', 'scripts/verify-security-assessment.py', 'scripts/qualify-speedtest.py', '.github/workflows/speedtest-security.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    name: Speedtest graph and command
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOMAXPROCS: '2'
      GOMEMLIMIT: 3GiB
      GOFLAGS: -p=1 -mod=readonly
      QUALIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.10'
          cache-dependency-path: |
            go.sum
            evmd/go.sum
            tests/speedtest/go.sum
      - name: Qualify the isolated speedtest module
        run: python3 scripts/qualify-speedtest.py
      - name: Preserve current diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: speedtest-security-evidence
          path: |
            speedtest-evidence/
            !speedtest-evidence/speedtest
          retention-days: 14
