name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      # Run the container as the runner user: as another user, Git refuses the
      # checkout ("dubious ownership") and Gitleaks reported success after
      # scanning no commit. The last check makes that case fail.
      - name: Scan Git history for secrets
        env:
          IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
        run: |
          set -o pipefail
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo "$IMAGE" \
            git --redact --verbose --no-color /repo 2>&1 | tee "$RUNNER_TEMP/gitleaks.log"
          if grep -Eq '^[0-9:]+[AP]M ERR ' "$RUNNER_TEMP/gitleaks.log" || ! grep -Eq ' [1-9][0-9]* commits scanned' "$RUNNER_TEMP/gitleaks.log"; then
            echo 'Gitleaks did not scan the history' >&2
            exit 1
          fi
