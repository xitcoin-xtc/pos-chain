name: JSON-RPC Compatibility Test

on:
  schedule:
    - cron: '30 2 * * 0' # weekly, Sunday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jsonrpc-compatibility-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod

      - name: Set up Docker
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Run JSON-RPC compatibility tests
        run: |
          # The suite reports "Not Implemented", "Legacy" and "Skipped" cases;
          # only "Failed" cases fail the job.
          make test-rpc-compat > test_output.log 2>&1 || echo 'Test command exited non-zero; checking results'
          cat test_output.log
          failed_count=$(grep -o "Failed:.*[0-9]" test_output.log | grep -o "[0-9]\+" | head -1 || echo "0")
          echo "Failed tests: ${failed_count:-0}"
          if [ "${failed_count:-0}" -gt 0 ]; then
            exit 1
          fi
