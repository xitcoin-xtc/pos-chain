name: Dependency security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite_group:
        description: Legacy Solidity suites to run (all of them, or only the chain-specific ones)
        type: choice
        options: [all, legacy, chain]
        default: all

permissions:
  contents: read

jobs:
  contract-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install reproducibly
        working-directory: contracts
        run: npm ci

      - name: Check secure toolchain compatibility
        working-directory: contracts
        run: npm run test:tooling

      - name: Audit contract dependencies
        working-directory: contracts
        run: npm audit --audit-level=high

  legacy-solidity-compatibility:
    name: Legacy Solidity (${{ matrix.suite }})
    if: github.event_name == 'workflow_dispatch' && (inputs.suite_group == 'all' || inputs.suite_group == 'legacy' || inputs.suite_group == 'chain')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite_group == 'chain' && '["precompiles","revert_cases"]' || '["basic","eip1559","exception","opcode","precompiles","revert_cases"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install locked workspace dependencies
        working-directory: tests/solidity
        run: yarn install --frozen-lockfile --non-interactive
      - name: Install and audit the modern generic-suite runner
        working-directory: contracts
        run: |
          npm ci
          npm run test:tooling
          npm audit --audit-level=high
      - name: Check real consumers of security overrides
        if: matrix.suite == 'basic'
        working-directory: tests/solidity
        run: |
          node check-test-discovery.cjs
          node check-security-compatibility.cjs
      - name: Test on disposable in-process EVM
        if: matrix.suite != 'precompiles' && matrix.suite != 'revert_cases'
        working-directory: tests/solidity/suites/${{ matrix.suite }}
        run: yarn test-ganache
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        if: matrix.suite == 'precompiles' || matrix.suite == 'revert_cases'
        with:
          go-version-file: go.mod
      - name: Build disposable chain test node
        if: matrix.suite == 'precompiles' || matrix.suite == 'revert_cases'
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
          GOMEMLIMIT: 2GiB
          GOFLAGS: -p=1
        run: make install
      - name: Test chain-specific precompiles on disposable node
        if: matrix.suite == 'precompiles' || matrix.suite == 'revert_cases'
        shell: bash
        run: |
          set -euo pipefail
          ./local_node.sh -y --no-install > /tmp/evmd.log 2>&1 &
          node_pid=$!
          trap 'kill "$node_pid" 2>/dev/null || true; wait "$node_pid" 2>/dev/null || true' EXIT
          source scripts/tests_compatibility_common.sh
          wait_for_node 10
          load_test_evm_chain_id
          if [[ '${{ matrix.suite }}' == precompiles ]]; then
            load_test_validator_address
          fi
          cd tests/solidity/suites/${{ matrix.suite }}
          yarn test-cosmos
