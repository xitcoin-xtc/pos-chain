name: Dependency security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go-vulnerabilities:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          bash scripts/run-govulncheck.sh ./...

      - name: Run evmd govulncheck
        if: ${{ !cancelled() && (success() || failure()) }}
        working-directory: evmd
        run: |
          go mod why github.com/pion/dtls/v2 golang.org/x/crypto/openpgp/armor
          bash ../scripts/run-govulncheck.sh -show verbose ./...

  contract-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install reproducibly
        working-directory: contracts
        run: npm ci

      - name: Audit contract dependencies
        working-directory: contracts
        run: npm audit --audit-level=high
