name: Dependency security

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite_group:
        description: Run all diagnostics or only the two chain-specific Solidity suites
        type: choice
        options: [all, chain]
        default: all

permissions:
  contents: read

jobs:
  go-vulnerabilities:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          bash scripts/run-govulncheck.sh ./...

      - name: Run evmd govulncheck
        if: ${{ !cancelled() && (success() || failure()) }}
        working-directory: evmd
        run: |
          go mod why github.com/pion/dtls/v2 golang.org/x/crypto/openpgp/armor
          bash ../scripts/run-govulncheck.sh -show verbose ./...

  contract-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: Install reproducibly
        working-directory: contracts
        run: npm ci

      - name: Audit contract dependencies
        working-directory: contracts
        run: npm audit --audit-level=high

  fresh-go-diagnostics:
    name: Fresh Go evidence (${{ matrix.module }})
    if: github.event_name == 'workflow_dispatch' && inputs.suite_group != 'chain'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module: [root, evmd]
    env:
      CGO_ENABLED: '1'
      GOWORK: 'off'
      GOMAXPROCS: '2'
      GOMEMLIMIT: 3GiB
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Collect current graph and raw findings
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/fresh-go-evidence/${{ matrix.module }}"
          mkdir -p "$evidence"
          if [[ '${{ matrix.module }}' == evmd ]]; then cd evmd; fi
          git rev-parse HEAD > "$evidence/source-head.txt"
          go version > "$evidence/toolchain.txt"
          sha256sum go.mod go.sum > "$evidence/lock-sha256.txt"
          go list -m -json all > "$evidence/modules.json"
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          # Diagnostic evidence does not renew the assessment or its exceptions.
          # JSON mode reports findings in the artifact; exit 0 does not mean clean.
          # Preserve execution errors; existing acceptance gates remain mandatory.
          set +e
          govulncheck -json ./... > "$evidence/govulncheck.jsonl" 2> "$evidence/govulncheck.stderr"
          scan_status=$?
          set -e
          printf '%s\n' "$scan_status" > "$evidence/scan-exit-code.txt"
          exit "$scan_status"
      - name: Compile packages and run targeted regression tests
        shell: bash
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/fresh-go-evidence/${{ matrix.module }}"
          if [[ '${{ matrix.module }}' == evmd ]]; then cd evmd; fi
          go test -mod=readonly -tags=test -run '^$' ./... > "$evidence/compile-check.log" 2>&1
          if [[ '${{ matrix.module }}' == root ]]; then
            go test -mod=readonly -tags=test ./rpc/... ./server/... ./client/... > "$evidence/targeted-tests.log" 2>&1
          fi
      - name: Preserve diagnostic and test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fresh-go-${{ matrix.module }}
          path: fresh-go-evidence/
          retention-days: 14

  legacy-solidity-compatibility:
    name: Legacy Solidity (${{ matrix.suite }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suite_group == 'chain' && '["precompiles","revert_cases"]' || '["basic","eip1559","exception","opcode","precompiles","revert_cases"]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install locked workspace dependencies
        working-directory: tests/solidity
        run: yarn install --frozen-lockfile --non-interactive
      - name: Test on disposable in-process EVM
        if: matrix.suite != 'precompiles' && matrix.suite != 'revert_cases'
        working-directory: tests/solidity/suites/${{ matrix.suite }}
        run: yarn test-ganache
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        if: matrix.suite == 'precompiles' || matrix.suite == 'revert_cases'
        with:
          go-version-file: go.mod
      - name: Build disposable chain test node
        if: matrix.suite == 'precompiles' || matrix.suite == 'revert_cases'
        env:
          CGO_ENABLED: '1'
          GOMAXPROCS: '2'
          GOMEMLIMIT: 2GiB
          GOFLAGS: -p=1
        run: make install
      - name: Test chain-specific precompiles on disposable node
        if: matrix.suite == 'precompiles' || matrix.suite == 'revert_cases'
        shell: bash
        run: |
          set -euo pipefail
          ./local_node.sh -y --no-install > "$RUNNER_TEMP/solidity-node.log" 2>&1 &
          node_pid=$!
          trap 'kill "$node_pid" 2>/dev/null || true; wait "$node_pid" 2>/dev/null || true' EXIT
          source scripts/tests_compatibility_common.sh
          wait_for_node 10
          cd tests/solidity/suites/${{ matrix.suite }}
          yarn test-cosmos
