name: Versioned Go integration qualification
on:
  pull_request:
    branches: [main]
    paths: ['go.mod', 'go.sum', 'evmd/**', '**/*.go', 'docs/go-fork-provenance.json', 'docs/versioned-go-qualification-resume.json', 'scripts/verify-go-fork-provenance.py', 'scripts/qualify-versioned-go.py', 'scripts/verify-versioned-go-reuse.py', 'scripts/test-versioned-go-reuse.py', 'docs/versioned-go-reuse.json', 'SECURITY-ASSESSMENT.md', 'docs/security-assessment.json', 'scripts/verify-security-assessment.py', 'scripts/run-govulncheck.sh', 'scripts/test-govulncheck-gate.py', 'SECURITY.md', 'README.md', 'AGENTS.md', 'UPSTREAMS.md', 'docs/development.md', 'docs/go-fork-provenance.md', '.github/workflows/versioned-go-qualification.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    name: Versioned graph (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        module: [root, evmd]
    env:
      GH_TOKEN: ${{ github.token }}
      GOMAXPROCS: '2'
      GOMEMLIMIT: 2GiB
      GOFLAGS: -p=1 -mod=readonly
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GOWORK: 'off'
      QUALIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.7'
          cache: false
      - name: Qualify the versioned graph and preserve diagnostics
        run: python3 scripts/qualify-versioned-go.py '${{ matrix.module }}'
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: versioned-go-${{ matrix.module }}
          path: versioned-evidence/
