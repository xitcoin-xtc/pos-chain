# Gitleaks: the default rules, plus what is specific to this repository.
# Reviewed false positives are listed by fingerprint in .gitleaksignore.

[extend]
useDefault = true

[allowlist]
description = "Files that cannot hold secrets"
paths = [
  '''(^|/)go\.(mod|sum|work|work\.sum)$''',
  '''(?i)\.(gif|jpe?g|pdf|png|svg)$''',
  '''(^|/)\.gitleaks\.toml$''',
]
# Reviewed false positives: key algorithm names, test contract addresses and
# a field name read as a legacy Vault token.
stopwords = [
  '''secp256k1''',
  '''0x205CF44075E77A3543abC690437F3b2819bc450a''',
  '''0x8FA78CEB7F04118Ec6d06AaC37Ca854691d8e963''',
]
regexes = [
  '''^s\.[Uu]seLegacyEIP712TypedData$''',
]

# Retired test accounts whose mnemonics and private keys were published with
# the upstream code. They must never come back: anyone can sign with them.
[[rules]]
id = "legacy-test-account"
description = "Mnemonic or private key of a retired, published test account"
regex = '''(?i)\b(gesture\s+inject\s+test\s+cycle|copper\s+push\s+brief\s+egg|maximum\s+display\s+century\s+economy|will\s+wear\s+settle\s+write|doll\s+midnight\s+silk\s+carpet|aunt\s+imitate\s+maximum\s+student)\b|(88cbead91aee890d|741de4f8988ea941|3b7955d25189c99a|8a36c69d940a92fc)'''
keywords = ["gesture", "copper", "maximum", "wear", "doll", "aunt", "88cbead9", "741de4f8", "3b7955d2", "8a36c69d"]
